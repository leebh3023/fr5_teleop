# Safe local default. Hardware mode still requires --confirm-hardware.
runtime:
  dry_run: true
  log_level: INFO
  status_hz: 10

server:
  host: 0.0.0.0
  port: 8443
  web_dir: web
  max_ws_message_bytes: 4096
  allowed_origins: []

tls:
  enabled: true
  cert_path: certs/cert.pem
  key_path: certs/key.pem

robot:
  ip: 192.168.58.2
  sdk_path: /home/user/fairino-python-sdk-2.0.8_robot3.7.8/linux
  exaxis_default: [0.0, 0.0, 0.0, 0.0]

timing:
  servo_period_s: 0.008
  # ERROR log after this many start/end events occur inside the window.
  servo_transition_window_s: 1.0
  servo_transition_limit: 4
  pose_timeout_s: 0.500
  worker_watchdog_s: 3.0
  worker_startup_timeout_s: 30.0
  graceful_shutdown_s: 1.0

motion:
  position_scale: 900.0
  ema_alpha: 0.2
  # Time-based speed limit. max_step_mm remains a per-command safety cap.
  max_velocity_mm_s: 150.0
  max_step_mm: 2
  workspace:
    x: [-600.0, 600.0]
    y: [-600.0, 600.0]
    z: [-500.0, 700.0]

# Disabled by default. Enable only after controller-side gripper configuration
# and a low-risk trigger/gripper commissioning test.
gripper:
  enabled: true
  index: 1
  activate_on_start: true
  initially_closed: false
  open_position: 0
  closed_position: 100
  velocity: 50
  force: 50
  command_max_time_ms: 3000
  action_timeout_s: 5.0
  poll_period_s: 0.050

# Disabled by default. The Fairino rx,ry,rz Euler convention is not
# documented by the vendor SDK (see AGENTS.md) and axis/sign have not been
# verified on real hardware. Enable only after the single-axis manual
# verification procedure in AGENTS.md's real-robot test protocol.
orientation:
  enabled: false
  scale: 1.0
  ema_alpha: 0.2
  max_angular_velocity_deg_s: 15.0
  max_step_deg: 1.0
  max_deviation_deg: 20.0
