<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>VR Teleop — FR5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0e17;
    color: #e0e6f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    width: 100%;
    max-width: 420px;
  }
  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8892a8;
    margin-bottom: 10px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 0.95rem;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
  }
  .dot.green { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
  .dot.red { background: #ef4444; box-shadow: 0 0 8px #ef444488; }
  .dot.yellow { background: #eab308; box-shadow: 0 0 8px #eab30888; }
  .mono {
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 0.85rem;
    color: #a5b4fc;
  }
  #btn-vr {
    width: 100%;
    max-width: 420px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    margin-bottom: 12px;
    transition: opacity 0.2s;
  }
  #btn-vr:hover { opacity: 0.9; }
  #btn-vr:disabled {
    background: #374151;
    color: #6b7280;
    cursor: not-allowed;
  }
  .tracking-active {
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.3); }
    50% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
  }
  .instructions {
    font-size: 0.85rem;
    color: #8892a8;
    line-height: 1.6;
    text-align: center;
  }
  .instructions b { color: #a5b4fc; }
</style>
</head>
<body>

<h1>🤖 VR Teleop — FR5</h1>

<button id="btn-vr">🥽 VR 세션 시작</button>

<div class="card" id="card-conn">
  <h2>연결 상태</h2>
  <div class="status-row">
    <span><span class="dot red" id="dot-ws"></span>WebSocket</span>
    <span class="mono" id="ws-status">연결 안됨</span>
  </div>
  <div class="status-row">
    <span><span class="dot red" id="dot-xr"></span>WebXR</span>
    <span class="mono" id="xr-status">비활성</span>
  </div>
</div>

<div class="card" id="card-ctrl">
  <h2>컨트롤러</h2>
  <div class="status-row">
    <span>그립 (데드맨)</span>
    <span class="mono" id="grip-status">—</span>
  </div>
  <div class="status-row">
    <span>트리거 (그리퍼)</span>
    <span class="mono" id="trigger-status">—</span>
  </div>
  <div class="status-row">
    <span>추적 상태</span>
    <span class="mono" id="track-status">대기</span>
  </div>
  <div class="status-row">
    <span>VR 위치</span>
    <span class="mono" id="vr-pos">—</span>
  </div>
</div>

<div class="card">
  <h2>로봇 TCP 목표</h2>
  <div class="status-row">
    <span>X, Y, Z (mm)</span>
    <span class="mono" id="robot-pos">—</span>
  </div>
  <div class="status-row">
    <span>프레임</span>
    <span class="mono" id="frame-count">0</span>
  </div>
  <div class="status-row">
    <span>그리퍼</span>
    <span class="mono" id="gripper-status">비활성</span>
  </div>
</div>

<div class="card instructions">
  <b>그립 버튼</b>을 꾹 누르면 로봇이 손을 따라갑니다.<br>
  놓으면 정지, 다시 누르면 현재 위치에서 재시작합니다.<br>
  <b>트리거</b>는 설정된 경우 그리퍼를 전환하며, 이후 grip을 놓았다
  다시 눌러야 로봇 추적이 재개됩니다.
</div>

<script>
// ──────────────────────────────────────────
//  WebSocket
// ──────────────────────────────────────────
let ws = null;
let wsConnected = false;
let sessionId = null;
let controllerOwned = false;
let poseSeq = 0;
let poseDropCount = 0;
let poseSendCount = 0;
let telemetrySeq = 0;
let xrFrameCount = 0;
let validPoseCount = 0;
let trackingLossCount = 0;
let lastXrFrameTimeMs = null;
let lastValidPoseTimeMs = null;
let maxXrFrameGapMs = 0;
let maxPoseGapMs = 0;
let lastRttMs = null;
let maxRttMs = null;
const MAX_BUFFERED_BYTES = 64 * 1024;

function resetClientStats() {
  poseDropCount = 0;
  poseSendCount = 0;
  telemetrySeq = 0;
  xrFrameCount = 0;
  validPoseCount = 0;
  trackingLossCount = 0;
  lastXrFrameTimeMs = null;
  lastValidPoseTimeMs = null;
  maxXrFrameGapMs = 0;
  maxPoseGapMs = 0;
  lastRttMs = null;
  maxRttMs = null;
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    wsConnected = true;
    document.getElementById('dot-ws').className = 'dot green';
    document.getElementById('ws-status').textContent = '협상 중';
    console.log('WebSocket 연결됨');
    refreshVRButton();
  };

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'hello') {
        sessionId = data.session_id;
        poseSeq = 0;
        resetClientStats();
        controllerOwned = false;
        document.getElementById('ws-status').textContent = '연결됨';
        if (xrSession) {
          sendEvent('webxr_started');
        }
        refreshVRButton();
      } else if (data.type === 'control') {
        controllerOwned = data.granted === true;
        if (!controllerOwned) {
          document.getElementById('track-status').textContent = '다른 controller 사용 중';
        }
      } else if (data.type === 'status') {
        updateStatusUI(data);
      } else if (data.type === 'telemetry_ack') {
        const rtt = Math.max(0, performance.now() - data.client_time_ms);
        lastRttMs = rtt;
        maxRttMs = maxRttMs === null ? rtt : Math.max(maxRttMs, rtt);
      } else if (data.type === 'error') {
        console.warn('Protocol error:', data.message);
      }
    } catch(err) {
      console.warn('Invalid server message:', err);
    }
  };

  ws.onclose = () => {
    wsConnected = false;
    sessionId = null;
    controllerOwned = false;
    document.getElementById('dot-ws').className = 'dot red';
    document.getElementById('ws-status').textContent = '끊김';
    refreshVRButton();
    setTimeout(connectWS, 2000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

function sendEvent(event) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !sessionId) return;
  ws.send(JSON.stringify({
    version: 1,
    type: 'event',
    session_id: sessionId,
    event: event
  }));
}

function sendPose(hand, pos, ori, grip, trigger) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !sessionId || !controllerOwned) return;
  // 전송을 생략한 frame도 sequence를 소비해 서버가 client-side drop을
  // pose sequence gap으로 진단할 수 있게 한다.
  const seq = poseSeq++;
  if (ws.bufferedAmount > MAX_BUFFERED_BYTES) {
    poseDropCount += 1;
    return;
  }
  ws.send(JSON.stringify({
    version: 1,
    type: 'pose',
    session_id: sessionId,
    seq: seq,
    client_time_ms: performance.now(),
    hand: hand,
    position_m: [pos.x, pos.y, pos.z],
    orientation_xyzw: [ori.x, ori.y, ori.z, ori.w],
    grip: grip,
    trigger: trigger
  }));
  poseSendCount += 1;
}

function sendClientTelemetry() {
  if (
    !ws
    || ws.readyState !== WebSocket.OPEN
    || !sessionId
    || !controllerOwned
  ) {
    return;
  }
  const now = performance.now();
  const currentPoseGapMs = (
    xrSession && lastValidPoseTimeMs !== null
      ? Math.max(0, now - lastValidPoseTimeMs)
      : 0
  );
  const reportPoseGapMs = Math.max(maxPoseGapMs, currentPoseGapMs);
  ws.send(JSON.stringify({
    version: 1,
    type: 'telemetry',
    session_id: sessionId,
    seq: telemetrySeq++,
    client_time_ms: now,
    xr_frame_count: xrFrameCount,
    valid_pose_count: validPoseCount,
    pose_send_count: poseSendCount,
    pose_drop_count: poseDropCount,
    tracking_loss_count: trackingLossCount,
    max_xr_frame_gap_ms: maxXrFrameGapMs,
    max_pose_gap_ms: reportPoseGapMs,
    ws_buffered_amount: ws.bufferedAmount,
    last_rtt_ms: lastRttMs,
    max_rtt_ms: maxRttMs
  }));
  maxXrFrameGapMs = 0;
  maxPoseGapMs = 0;
  maxRttMs = lastRttMs;
}

function updateStatusUI(data) {
  const trackEl = document.getElementById('track-status');
  const cardCtrl = document.getElementById('card-ctrl');

  if (data.state === 'FAULT') {
    trackEl.textContent = `🔴 FAULT: ${data.fault || '알 수 없는 오류'}`;
    cardCtrl.classList.remove('tracking-active');
  } else if (data.state === 'GRIPPER_ACTION') {
    trackEl.textContent = '🟠 그리퍼 동작 중 — 로봇 추적 정지';
    cardCtrl.classList.remove('tracking-active');
  } else if (data.state === 'SLEEPING') {
    trackEl.textContent = data.rearm_required
      ? '💤 슬립 — grip을 완전히 놓았다 다시 누르세요'
      : '💤 슬립 — grip을 다시 누르면 재개';
    cardCtrl.classList.remove('tracking-active');
  } else if (data.rearm_required) {
    trackEl.textContent = '🟡 재무장 대기 — grip을 완전히 놓았다 다시 누르세요';
    cardCtrl.classList.remove('tracking-active');
  } else if (data.tracking) {
    trackEl.textContent = '🟢 추적 중';
    cardCtrl.classList.add('tracking-active');
  } else {
    trackEl.textContent = data.state || '대기';
    cardCtrl.classList.remove('tracking-active');
  }

  if (data.robot_tcp) {
    const t = data.robot_tcp;
    document.getElementById('robot-pos').textContent =
      `${t[0].toFixed(1)}, ${t[1].toFixed(1)}, ${t[2].toFixed(1)}`;
  }
  document.getElementById('frame-count').textContent =
    `${data.tick || 0} / drop ${poseDropCount}`;
  const gripperEl = document.getElementById('gripper-status');
  if (!data.gripper_enabled) {
    gripperEl.textContent = '비활성';
  } else if (data.gripper_busy) {
    gripperEl.textContent = `동작 중 → ${data.gripper_position}%`;
  } else {
    gripperEl.textContent = `대기 (${data.gripper_position}%)`;
  }
}

// ──────────────────────────────────────────
//  WebXR
// ──────────────────────────────────────────
let xrSession = null;
let refSpace = null;
let gl = null;
let xrSupported = false;
let xrCheckComplete = false;
let gripLatchedByHand = { left: false, right: false, none: false };
let triggerLatchedByHand = { left: false, right: false, none: false };

function readAnalogButton(button, hand, latch) {
  const key = hand === 'left' || hand === 'right' ? hand : 'none';
  if (!button) {
    latch[key] = false;
    return false;
  }
  if (button.pressed || button.value >= 0.65) {
    latch[key] = true;
  } else if (button.value <= 0.35) {
    latch[key] = false;
  }
  return latch[key];
}

function readGripButton(button, hand) {
  return readAnalogButton(button, hand, gripLatchedByHand);
}

function readTriggerButton(button, hand) {
  return readAnalogButton(button, hand, triggerLatchedByHand);
}

const btnVR = document.getElementById('btn-vr');
btnVR.disabled = true;

function refreshVRButton() {
  const ready = xrSupported && wsConnected && sessionId && !xrSession;
  btnVR.disabled = !ready;
  if (!xrCheckComplete) {
    btnVR.textContent = 'WebXR 확인 중';
  } else if (!xrSupported) {
    btnVR.textContent = '❌ WebXR 미지원 브라우저';
  } else if (!wsConnected || !sessionId) {
    btnVR.textContent = 'WebSocket 연결 대기';
  } else if (!xrSession) {
    btnVR.textContent = '🥽 VR 세션 시작';
  }
}

// WebXR 지원 확인
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(supported => {
    xrCheckComplete = true;
    if (supported) {
      xrSupported = true;
      btnVR.addEventListener('click', startVR);
      refreshVRButton();
    } else {
      refreshVRButton();
    }
  });
} else {
  xrCheckComplete = true;
  refreshVRButton();
}

async function startVR() {
  try {
    xrSession = await navigator.xr.requestSession('immersive-vr', {
      requiredFeatures: ['local-floor']
    });
    lastXrFrameTimeMs = null;
    lastValidPoseTimeMs = null;
    maxXrFrameGapMs = 0;
    maxPoseGapMs = 0;

    // WebXR은 렌더링할 3D 그래픽(WebGL) 레이어가 없으면 무한 로딩에 빠집니다.
    // 위치 추적만 하더라도 더미(Dummy) WebGL 캔버스를 만들어 연결해 주어야 합니다.
    const canvas = document.createElement('canvas');
    gl = canvas.getContext('webgl', { xrCompatible: true });
    await gl.makeXRCompatible();
    xrSession.updateRenderState({
      baseLayer: new XRWebGLLayer(xrSession, gl)
    });

    document.getElementById('dot-xr').className = 'dot green';
    document.getElementById('xr-status').textContent = '활성';
    btnVR.textContent = '🥽 VR 세션 활성';
    btnVR.disabled = true;

    sendEvent('webxr_started');

    refSpace = await xrSession.requestReferenceSpace('local-floor');

    xrSession.addEventListener('end', () => {
      xrSession = null;
      lastXrFrameTimeMs = null;
      lastValidPoseTimeMs = null;
      gripLatchedByHand = { left: false, right: false, none: false };
      triggerLatchedByHand = { left: false, right: false, none: false };
      document.getElementById('dot-xr').className = 'dot red';
      document.getElementById('xr-status').textContent = '종료됨';
      btnVR.textContent = '🥽 VR 세션 시작';
      sendEvent('webxr_ended');
      controllerOwned = false;
      refreshVRButton();
    });

    xrSession.requestAnimationFrame(onXRFrame);
  } catch (err) {
    console.error('VR 세션 시작 실패:', err);
    document.getElementById('xr-status').textContent = '에러';
  }
}

function onXRFrame(time, frame) {
  if (!xrSession) return;
  xrSession.requestAnimationFrame(onXRFrame);
  xrFrameCount += 1;
  if (lastXrFrameTimeMs !== null) {
    maxXrFrameGapMs = Math.max(
      maxXrFrameGapMs,
      Math.max(0, time - lastXrFrameTimeMs)
    );
  }
  lastXrFrameTimeMs = time;

  // 프레임마다 화면을 지워주어 VR 화면이 검은색(또는 회색) 빈 공간으로 정상 표시되게 합니다.
  if (gl && xrSession.renderState.baseLayer) {
    const layer = xrSession.renderState.baseLayer;
    gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
    gl.clearColor(0.1, 0.1, 0.1, 1.0); // 어두운 회색
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  }

  const sources = Array.from(xrSession.inputSources);
  const source = (
    sources.find(item => item.handedness === 'right' && item.gripSpace)
    || sources.find(item => item.gripSpace)
  );
  if (!source) {
    trackingLossCount += 1;
    document.getElementById('track-status').textContent =
      '🟡 controller source 없음';
    return;
  }

  const pose = frame.getPose(source.gripSpace, refSpace);
  if (!pose) {
    trackingLossCount += 1;
    document.getElementById('track-status').textContent =
      '🟡 controller pose 추적 손실';
    return;
  }
  validPoseCount += 1;
  if (lastValidPoseTimeMs !== null) {
    maxPoseGapMs = Math.max(
      maxPoseGapMs,
      Math.max(0, time - lastValidPoseTimeMs)
    );
  }
  lastValidPoseTimeMs = time;

  const pos = pose.transform.position;
  const ori = pose.transform.orientation;

  // 버튼: 0=trigger, 1=grip
  let grip = false;
  let trigger = false;
  if (source.gamepad) {
    trigger = readTriggerButton(
      source.gamepad.buttons[0],
      source.handedness
    );
    grip = readGripButton(source.gamepad.buttons[1], source.handedness);
  }

  document.getElementById('vr-pos').textContent =
    `${pos.x.toFixed(3)}, ${pos.y.toFixed(3)}, ${pos.z.toFixed(3)}`;
  document.getElementById('grip-status').textContent =
    grip ? '🟢 누름' : '⚪ 해제';
  document.getElementById('trigger-status').textContent =
    trigger ? '🟠 누름' : '⚪ 해제';

  sendPose(source.handedness || 'right', pos, ori, grip, trigger);
}

// ──────────────────────────────────────────
//  초기화
// ──────────────────────────────────────────
connectWS();
setInterval(sendClientTelemetry, 1000);
</script>
</body>
</html>
