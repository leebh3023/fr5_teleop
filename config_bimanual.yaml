# Bimanual (dual-arm) configuration example.
# Uses robot.arms instead of robot.ip for two independent FR5 robots.

runtime:
  dry_run: false
  log_level: INFO
  status_hz: 10

server:
  host: 0.0.0.0
  port: 8443
  web_dir: web
  max_ws_message_bytes: 4096
  allowed_origins: []

tls:
  enabled: true
  cert_path: certs/cert.pem
  key_path: certs/key.pem

robot:
  sdk_path: /home/user/fairino-python-sdk-2.0.8_robot3.7.8/linux
  exaxis_default: [0.0, 0.0, 0.0, 0.0]
  arms:
    left:
      ip: 192.168.58.2
    right:
      ip: 192.168.58.3

timing:
  servo_period_s: 0.008
  servo_transition_window_s: 1.0
  servo_transition_limit: 4
  pose_timeout_s: 0.500
  worker_watchdog_s: 3.0
  worker_startup_timeout_s: 30.0
  graceful_shutdown_s: 2.0

motion:
  position_scale: 800.0
  ema_alpha: 0.2
  max_velocity_mm_s: 150.0
  max_step_mm: 2.0
  workspace:
    x: [-600.0, 600.0]
    y: [-600.0, 600.0]
    z: [50.0, 700.0]

# Global gripper defaults. Per-arm overrides can be set in robot.arms.<hand>.gripper.
gripper:
  enabled: true
  index: 1
  activate_on_start: true
  initially_closed: false
  open_position: 0
  closed_position: 100
  velocity: 50
  force: 50
  command_max_time_ms: 3000
  action_timeout_s: 5.0
  poll_period_s: 0.050
