runtime:
  dry_run: true
  log_level: INFO
  status_hz: 10

server:
  host: 0.0.0.0
  port: 8443
  web_dir: /opt/vr-teleop/web
  max_ws_message_bytes: 4096
  allowed_origins: []

tls:
  enabled: true
  cert_path: /etc/vr-teleop/tls/cert.pem
  key_path: /etc/vr-teleop/tls/key.pem

robot:
  ip: 192.168.58.2
  # Use the official SDK matching the controller firmware.
  # Example for Robot V3.7.8: /opt/fairino-sdk-2.0.8_robot3.7.8/linux
  sdk_path: /opt/fairino-sdk/linux
  exaxis_default: [0.0, 0.0, 0.0, 0.0]

timing:
  servo_period_s: 0.008
  servo_transition_window_s: 1.0
  servo_transition_limit: 4
  pose_timeout_s: 0.200
  worker_watchdog_s: 0.500
  worker_startup_timeout_s: 10.0
  graceful_shutdown_s: 2.0

motion:
  # Conservative commissioning defaults. Increase only after recorded testing.
  position_scale: 100.0
  ema_alpha: 0.25
  max_velocity_mm_s: 31.25
  max_step_mm: 0.25
  # Replace these with a measured base-frame envelope around the initial TCP.
  workspace:
    x: [-600.0, 600.0]
    y: [-600.0, 600.0]
    z: [50.0, 700.0]

gripper:
  enabled: false
  index: 1
  activate_on_start: false
  initially_closed: false
  open_position: 0
  closed_position: 100
  velocity: 30
  force: 30
  command_max_time_ms: 3000
  action_timeout_s: 5.0
  poll_period_s: 0.050

# Disabled by default. The Fairino rx,ry,rz Euler convention is not
# documented by the vendor SDK (see AGENTS.md) and axis/sign have not been
# verified on real hardware. Enable only after the single-axis manual
# verification procedure in AGENTS.md's real-robot test protocol.
orientation:
  enabled: false
  scale: 1.0
  ema_alpha: 0.2
  max_angular_velocity_deg_s: 15.0
  max_step_deg: 1.0
  max_deviation_deg: 20.0
